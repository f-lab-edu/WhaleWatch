spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driverClassName: org.h2.Driver
    username: sa
    password:
    initialization-mode: always
  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    generate-ddl: true
  main:
    web-application-type: servlet
  # H2 콘솔 활성화 설정 (spring 하위로 이동)
  h2:
    console:
      enabled: true
      path: /h2-console
