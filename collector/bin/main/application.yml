server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driverClassName: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9093}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer


exchanges:
  exchanges:
    binance:
      enabled: true
      websocketType: text
      url: "wss://stream.binance.com:9443/stream?streams=btcusdt@trade/ethusdt@trade/solusdt@trade"
      mapping:
        type: "data.e"
        code: "data.s"
        tradePrice: "data.p"
        tradeVolume: "data.q"
        tradeTimestamp: "data.T"
        askBid: "data.m"
      threshold:
        BTC: 0.8
        ETH: 22.0
        SOL: 300.0
    upbit:
      enabled: true
      websocketType: binary
      url: "wss://api.upbit.com/websocket/v1"
      mapping:
        type: "type"
        code: "code"
        tradePrice: "trade_price"
        tradeVolume: "trade_volume"
        tradeTimestamp: "trade_timestamp"
        askBid: "ask_bid"
      threshold:
        BTC: 0.8
        ETH: 22.0
        SOL: 300.0
    bithumb:
      enabled: true
      websocketType: binary
      url: "wss://ws-api.bithumb.com/websocket/v1"
      mapping:
        type: "type"
        code: "code"
        tradePrice: "trade_price"
        tradeVolume: "trade_volume"
        tradeTimestamp: "trade_timestamp"
        askBid: "ask_bid"
      threshold:
        BTC: 0.8
        ETH: 22.0
        SOL: 300.0

logging:
  level:
    com.whalewatch: DEBUG
